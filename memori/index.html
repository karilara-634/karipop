<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Voltea y Encuentra - Chiquibeitas</title>
<style>
body { background:#4A154B; color:white; font-family:Arial; text-align:center; margin:0; }
h1 { color:#FFD700; margin-top:20px; }
.menu-btn { background:#FF4500; color:white; border:none; padding:15px 30px; font-size:16px; border-radius:10px; cursor:pointer; margin:10px; }
.dificultad { background:#32CD32; color:white; border:none; padding:10px 20px; font-size:14px; border-radius:8px; cursor:pointer; margin:8px; display:block; margin:10px auto; width:200px;}
.dificultad.medio { background:#FFA500; }
.dificultad.dificil { background:#FF4500; }
.hud { background:#300B32; padding:10px; display:flex; justify-content:space-around; }
.poderes button { margin:5px; padding:8px; border-radius:5px; border:none; cursor:pointer; }
.tablero { display:grid; grid-template-columns:repeat(4,90px); gap:10px; justify-content:center; margin:20px; }
.carta { width:90px; height:90px; background:#C71585; color:white; font-size:35px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:10px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
let score=0, moves=0, first=null, second=null, waiting=false, pairs=0, total=6;
let poderes = {kari:1, beita:1, cristi:1, daya:1};
let emojis = ["🐶","🐱","🍎","🍌","🚗","⚽","👕","🎸","🚀","🍕","⭐","🌵"];
let cartas = [];

function menu(){
document.getElementById('app').innerHTML = `
<h1>VOLTEA Y ENCUENTRA</h1>
<h3>Versión Chiquibeitas</h3>
<p>🐇 Kari | 🐳 Beita | 🦄 Cristi | 🐸 Daya</p>
<button class="menu-btn" onclick="selectDif()">EMPEZAR A JUGAR</button>
`;
}

function selectDif(){
document.getElementById('app').innerHTML = `
<h1>Selecciona la Dificultad</h1>
<button class="dificultad" onclick="start(6)">Fácil (6 Pares)</button>
<button class="dificultad medio" onclick="start(8)">Medio (8 Pares)</button>
<button class="dificultad dificil" onclick="start(10)">Difícil (10 Pares)</button>
<button class="menu-btn" onclick="menu()">Volver</button>
`;
}

function start(p){
total=p; pairs=0; score=0; moves=0; poderes={kari:1,beita:1,cristi:1,daya:1};
let seleccion = emojis.slice(0,p);
cartas = [...seleccion, ...seleccion].sort(()=>0.5-Math.random());
let html = `<div class="hud"><span>Puntos: ${score}</span><span>Movimientos: ${moves}</span><button onclick="menu()">🏠 Menú</button></div>`;
html += `<div class="poderes">Ayudas: 
<button onclick="useKari()">🐇 Kari (${poderes.kari})</button>
<button onclick="useBeita()">🐳 Beita (${poderes.beita})</button>
<button onclick="useCristi()">🦄 Cristi (${poderes.cristi})</button>
<button onclick="useDaya()">🐸 Daya (${poderes.daya})</button></div>`;
html += `<div class="tablero">`;
cartas.forEach((c,i)=>{ html += `<div class="carta" data-i="${i}" onclick="clickCard(${i})">?</div>`; });
html += `</div>`;
document.getElementById('app').innerHTML = html;
}

function clickCard(i){
if(waiting) return;
let el = document.querySelector(`[data-i="${i}"]`);
if(el.innerText !== '?') return;
el.innerText = cartas[i]; el.style.background='white'; el.style.color='black';
if(first===null) first=i;
else{
 second=i; moves++; document.querySelector('.hud span:nth-child(2)').innerText='Movimientos: '+moves;
 if(cartas[first]===cartas[second]){
   score+=100; document.querySelector('.hud span:nth-child(1)').innerText='Puntos: '+score;
   pairs++; first=null; second=null;
   if(pairs===total) setTimeout(()=>{alert('¡Ganaste! Puntos: '+score); menu();},500);
 } else {
   waiting=true;
   setTimeout(()=>{
     document.querySelector(`[data-i="${first}"]`).innerText='?';
     document.querySelector(`[data-i="${second}"]`).innerText='?';
     document.querySelector(`[data-i="${first}"]`).style.background='#C71585';
     document.querySelector(`[data-i="${second}"]`).style.background='#C71585';
     first=null; second=null; waiting=false;
   },700);
 }
}
}

function useKari(){ if(poderes.kari>0){ poderes.kari--; alert('Kari barajó las cartas 🐇'); }}
function useBeita(){ if(poderes.beita>0){ poderes.beita--; alert('Beita revela todo 2 seg 🐳'); }}
function useCristi(){ if(poderes.cristi>0){ poderes.cristi--; alert('Cristi encuentra una pareja 🦄'); }}
function useDaya(){ if(poderes.daya>0){ poderes.daya--; score+=200; alert('Daya te da +200 puntos 🐸'); }}

menu();
</script>
</body>
</html>
