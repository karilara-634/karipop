<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karipop</title>
<style>
  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    font-family: 'Poppins', sans-serif; 
    color: white; 
    text-align: center; 
    overflow: hidden;
  }

  #bgContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 42, 0.65);
    z-index: -1;
  }

  #startScreen, #gameScreen { 
    width: 100vw; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
  }
  
  #gameScreen { display: none; }
  
  h1 { 
    font-size: 3em; 
    color: #FFD700; 
    text-shadow: 0 0 10px #FFD700, 0 0 20px rgba(0,0,0,0.8); 
    margin: 10px 0; 
  }

  .avatar-list { 
    display: flex; 
    gap: 15px; 
    margin: 20px 0; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 80%;
  }

  .avatar { 
    background: rgba(0, 0, 0, 0.5); 
    padding: 10px 15px; 
    border-radius: 15px; 
    font-size: 1.2em; 
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(5px);
  }

  .tubes { 
    display: flex; 
    gap: 15px; 
    margin-top: 15px; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 95vw;
  }

  .tube { 
    width: 70px; 
    height: 280px; 
    border: 3px solid #FFD700; 
    border-radius: 35px; 
    display: flex; 
    flex-direction: column-reverse; 
    padding: 5px; 
    cursor: pointer; 
    background: rgba(0, 0, 0, 0.5); 
    backdrop-filter: blur(5px);
    transition: transform 0.2s, border-color 0.2s;
  }

  .tube:hover {
    transform: translateY(-5px);
  }

  .ball { 
    width: 54px; 
    height: 54px; 
    border-radius: 50%; 
    margin: 3px auto; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 2em; 
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
  }

  .btn-container {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
  }

  .btn { 
    background: #FFD700; 
    color: #000; 
    border: none; 
    padding: 12px 25px; 
    border-radius: 20px; 
    font-size: 1.1em; 
    cursor: pointer; 
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .selected { 
    border: 4px solid #FF4500 !important; 
    box-shadow: 0 0 15px #FF4500; 
  }

  /* Modal interno para mensajes dentro del juego */
  #messageModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .modal-content {
    background: rgba(20, 20, 50, 0.95);
    border: 3px solid #FFD700;
    padding: 30px;
    border-radius: 20px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
</style>
</head>
<body>

<div id="bgContainer"></div>
<div id="overlay"></div>

<!-- Modal interno para avisos -->
<div id="messageModal">
  <div class="modal-content">
    <h2 id="modalTitle" style="color: #FFD700; margin-top: 0;">¡Título!</h2>
    <p id="modalText" style="font-size: 1.2em; margin-bottom: 20px;">Mensaje aquí</p>
    <button class="btn" id="modalBtn" onclick="closeModal()">Continuar</button>
  </div>
</div>

<div id="startScreen">
  <h1>Karipop</h1>
  <p>Kari pop versión Chiquibeitas</p>
  <h2>🌟 Los Avatares Principales 🌟</h2>
  <div class="avatar-list">
    <div class="avatar">🐰 : Kari</div>
    <div class="avatar">🧀 : Beita</div>
    <div class="avatar">🌸 : Daya</div>
    <div class="avatar">🍒 : Cristi</div>
  </div>
  <button class="btn" onclick="startGame()">¡Jugar Ahora!</button>
</div>

<div id="gameScreen">
  <h1>Karipop</h1>
  <p id="levelText">Nivel 1 - Ordena a cada avatar en su tubo</p>
  <p id="movesText" style="font-weight: bold; color: #FFD700;">Intentos restantes: 0</p>
  <div class="tubes" id="tubes"></div>
  <div class="btn-container">
    <button class="btn" onclick="undoMove()">Deshacer</button>
    <button class="btn" onclick="addExtraTube()">+ Tubo Extra</button>
    <button class="btn" onclick="restartGame()">Reiniciar</button>
  </div>
</div>

<script>
const BACKGROUND_IMAGE_URL = 'https://i.pinimg.com/originals/2h/km/52/2hkm52.jpg'; 
document.getElementById('bgContainer').style.backgroundImage = `url('${BACKGROUND_IMAGE_URL}')`;

// Colores claros optimizados para que hagan contraste con emojis oscuros o claros
const allAvatars = [
  {emoji:'🐰', name:'Kari', color:'#ffb3ba'},     
  {emoji:'🧀', name:'Beita', color:'#ffffba'},    
  {emoji:'🌸', name:'Daya', color:'#baffc9'},     
  {emoji:'🍒', name:'Cristi', color:'#ffdfba'},   
  {emoji:'🦫', name:'Adriana', color:'#bae1ff'},  
  {emoji:'🦭', name:'Mirella', color:'#e8c5ff'},  
  {emoji:'🦊', name:'Alexis', color:'#ffd1dc'}    
];

let level = 1;
let tubes = [];
let selected = null;
const TUBE_CAPACITY = 4;
let remainingMoves = 0;
let historyMoves = []; // Historial para la función Deshacer (Undo)
let extraTubeAdded = false;

function getAvatarsForLevel(lvl){
  if(lvl <= 2) return allAvatars.slice(0,4);
  if(lvl == 3) return allAvatars.slice(0,5);
  if(lvl == 4) return allAvatars.slice(0,6);
  return allAvatars;
}

function getTubesForLevel(lvl){
  if(lvl <= 2) return 6;
  if(lvl == 3) return 7;
  if(lvl == 4) return 8;  
  return 9;
}

function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  createTubes();
}

function createTubes(){
  document.getElementById('levelText').innerText = `Nivel ${level} - Ordena a cada avatar en su tubo`;
  const container = document.getElementById('tubes');
  container.innerHTML = '';
  tubes = [];
  selected = null;
  historyMoves = [];
  extraTubeAdded = false;
  
  const avatars = getAvatarsForLevel(level);
  const totalTubes = getTubesForLevel(level);
  
  // Asignar un límite de intentos dinámico y generoso según la cantidad de fichas
  remainingMoves = (avatars.length * TUBE_CAPACITY) * 3;
  updateMovesDisplay();

  let allBalls = [];
  avatars.forEach(avatar => {
    for(let i = 0; i < TUBE_CAPACITY; i++) {
      allBalls.push(avatar);
    }
  });
  
  // Mezclar bolitas aleatoriamente
  allBalls.sort(() => Math.random() - 0.5);
  
  for(let i = 0; i < totalTubes; i++){
    tubes.push([]);
    let tubeEl = document.createElement('div');
    tubeEl.className = 'tube';
    tubeEl.onclick = () => selectTube(i);
    container.appendChild(tubeEl);
  }
  
  let ballIndex = 0;
  for(let i = 0; i < totalTubes - 2; i++){
    for(let j = 0; j < TUBE_CAPACITY; j++){
      if(ballIndex < allBalls.length){
        tubes[i].push(allBalls[ballIndex]);
        ballIndex++;
      }
    }
  }

  renderTubes();
}

function selectTube(i){
  const tubeElements = document.querySelectorAll('.tube');
  
  if(selected === null){
    if(tubes[i].length > 0){
      selected = i;
      tubeElements[i].classList.add('selected');
    }
  } else {
    // Reglas de movimiento: Mismo color o tubo vacío, y destino con espacio suficiente
    let validMove = false;
    if (selected !== i && tubes[i].length < TUBE_CAPACITY) {
      let sourceTube = tubes[selected];
      let destTube = tubes[i];
      let movingBall = sourceTube[sourceTube.length - 1];

      if (destTube.length === 0 || destTube[destTube.length - 1].emoji === movingBall.emoji) {
        validMove = true;
      }
    }

    if(validMove){
      // Guardar estado actual en el historial antes de mover
      historyMoves.push(tubes.map(t => [...t]));

      let ball = tubes[selected].pop();
      tubes[i].push(ball);
      
      remainingMoves--;
      updateMovesDisplay();
      renderTubes();
      
      setTimeout(checkGameStatus, 100);
    }
    
    tubeElements.forEach(t => t.classList.remove('selected'));
    selected = null;
  }
}

function undoMove() {
  if (historyMoves.length > 0) {
    tubes = historyMoves.pop();
    remainingMoves++;
    updateMovesDisplay();
    renderTubes();
    selected = null;
    document.querySelectorAll('.tube').forEach(t => t.classList.remove('selected'));
  }
}

function addExtraTube() {
  if (!extraTubeAdded) {
    tubes.push([]);
    extraTubeAdded = true;
    
    const container = document.getElementById('tubes');
    let tubeEl = document.createElement('div');
    tubeEl.className = 'tube';
    let newIndex = tubes.length - 1;
    tubeEl.onclick = () => selectTube(newIndex);
    container.appendChild(tubeEl);
    renderTubes();
  } else {
    showModal("Aviso", "Ya has añadido el tubo extra en este nivel.");
  }
}

function updateMovesDisplay() {
  document.getElementById('movesText').innerText = `Intentos restantes: ${remainingMoves}`;
}

function renderTubes(){
  const tubeDivs = document.querySelectorAll('.tube');
  
  tubeDivs.forEach((tubeEl, i) => {
    tubeEl.innerHTML = '';
    if(tubes[i]) {
      tubes[i].forEach(ballData => {
        let ball = document.createElement('div');
        ball.className = 'ball';
        ball.innerText = ballData.emoji;
        ball.style.backgroundColor = ballData.color; 
        tubeEl.appendChild(ball);
      });
    }
  });
}

function checkGameStatus(){
  let completedTubes = 0;
  const avatarsInPlay = getAvatarsForLevel(level).length;

  for(let tube of tubes){
    if(tube.length === 0){
      continue;
    }
    if(tube.length === TUBE_CAPACITY){
      const firstEmoji = tube[0].emoji;
      const allSame = tube.every(ball => ball.emoji === firstEmoji);
      if(allSame) {
        completedTubes++;
      }
    }
  }

  if(completedTubes === avatarsInPlay){
    showModal("🎉 ¡Nivel Superado!", `Has completado exitosamente el Nivel ${level}.`, () => {
      level++;
      createTubes();
    });
    return;
  }

  if(remainingMoves <= 0) {
    showModal("😢 ¡Sin Intentos!", "Te has quedado sin movimientos. Reiniciemos el nivel.", () => {
      restartGame();
    });
  }
}

function showModal(title, text, callback = null) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalText').innerText = text;
  const btn = document.getElementById('modalBtn');
  
  // Reemplazar la acción del botón del modal de forma limpia
  let newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  
  newBtn.onclick = () => {
    closeModal();
    if(callback) callback();
  };
  
  document.getElementById('messageModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('messageModal').style.display = 'none';
}

function restartGame(){ 
  createTubes(); 
}
</script>
</body>
</html>
