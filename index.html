<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karipop</title>
<style>
  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    font-family: 'Poppins', sans-serif; 
    color: white; 
    text-align: center; 
    overflow: hidden;
  }

  /* Fondo dinámico cargado desde la variable de JavaScript */
  #bgContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }

  /* Capa para oscurecer ligeramente la imagen y mejorar visibilidad */
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 42, 0.65);
    z-index: -1;
  }

  #startScreen, #gameScreen { 
    width: 100vw; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
  }
  
  #gameScreen { display: none; }
  
  h1 { 
    font-size: 3em; 
    color: #FFD700; 
    text-shadow: 0 0 10px #FFD700, 0 0 20px rgba(0,0,0,0.8); 
    margin: 10px 0; 
  }

  .avatar-list { 
    display: flex; 
    gap: 15px; 
    margin: 20px 0; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 80%;
  }

  .avatar { 
    background: rgba(0, 0, 0, 0.5); 
    padding: 10px 15px; 
    border-radius: 15px; 
    font-size: 1.2em; 
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(5px);
  }

  .tubes { 
    display: flex; 
    gap: 15px; 
    margin-top: 15px; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 95vw;
  }

  .tube { 
    width: 70px; 
    height: 280px; 
    border: 3px solid #FFD700; 
    border-radius: 35px; 
    display: flex; 
    flex-direction: column-reverse; 
    padding: 5px; 
    cursor: pointer; 
    background: rgba(0, 0, 0, 0.5); 
    backdrop-filter: blur(5px);
    transition: transform 0.2s, border-color 0.2s;
  }

  .tube:hover {
    transform: translateY(-5px);
  }

  .ball { 
    width: 54px; 
    height: 54px; 
    border-radius: 50%; 
    margin: 3px auto; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 2em; 
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
  }

  .btn { 
    background: #FFD700; 
    color: #000; 
    border: none; 
    padding: 12px 25px; 
    border-radius: 20px; 
    font-size: 1.1em; 
    cursor: pointer; 
    margin: 10px; 
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }

  .btn:active {
    transform: scale(0.95);
  }

  .selected { 
    border: 4px solid #FF4500 !important; 
    box-shadow: 0 0 15px #FF4500; 
  }
</style>
</head>
<body>

<div id="bgContainer"></div>
<div id="overlay"></div>

<div id="startScreen">
  <h1>Karipop</h1>
  <p>Kari pop versión Chiquibeitas</p>
  <h2>🌟 Los Avatares Principales 🌟</h2>
  <div class="avatar-list">
    <div class="avatar">🐰 : Kari</div>
    <div class="avatar">🧀 : Beita</div>
    <div class="avatar">🌸 : Daya</div>
    <div class="avatar">🍒 : Cristi</div>
  </div>
  <button class="btn" onclick="startGame()">¡Jugar Ahora!</button>
</div>

<div id="gameScreen">
  <h1>Karipop</h1>
  <p id="levelText">Nivel 1 - Ordena a cada avatar en su tubo</p>
  <div class="tubes" id="tubes"></div>
  <button class="btn" onclick="restartGame()">Reiniciar</button>
</div>

<script>
// --- CONFIGURACIÓN DE LA IMAGEN DE FONDO ---
// Puedes reemplazar este enlace si deseas utilizar la URL directa final (.jpg / .png)
const BACKGROUND_IMAGE_URL = 'https://i.pinimg.com/originals/2h/km/52/2hkm52.jpg'; 

document.getElementById('bgContainer').style.backgroundImage = `url('${BACKGROUND_IMAGE_URL}')`;

// Avatares con sus respectivos colores asignados
const allAvatars = [
  {emoji:'🐰', name:'Kari', color:'#ffb7c5'},     // Rosa
  {emoji:'🧀', name:'Beita', color:'#ffe135'},    // Amarillo
  {emoji:'🌸', name:'Daya', color:'#e3a018'},     // Melocotón/Lila
  {emoji:'🍒', name:'Cristi', color:'#ff6b6b'},   // Rojo suave
  {emoji:'🦫', name:'Adriana', color:'#d4a373'},  // Café claro
  {emoji:'🦭', name:'Mirella', color:'#a2d2ff'},  // Azul claro
  {emoji:'🦊', name:'Alexis', color:'#fca311'}    // Naranja
];

let level = 1;
let tubes = [];
let selected = null;
const TUBE_CAPACITY = 4;

function getAvatarsForLevel(lvl){
  if(lvl <= 2) return allAvatars.slice(0,4);
  if(lvl == 3) return allAvatars.slice(0,5);
  if(lvl == 4) return allAvatars.slice(0,6);
  return allAvatars;
}

function getTubesForLevel(lvl){
  if(lvl <= 2) return 6;
  if(lvl == 3) return 7;
  if(lvl == 4) return 8;  
  return 9;
}

function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  createTubes();
}

function createTubes(){
  document.getElementById('levelText').innerText = `Nivel ${level} - Ordena a cada avatar en su tubo`;
  const container = document.getElementById('tubes');
  container.innerHTML = '';
  tubes = [];
  selected = null;
  
  const avatars = getAvatarsForLevel(level);
  const totalTubes = getTubesForLevel(level);
  
  let allBalls = [];
  avatars.forEach(avatar => {
    for(let i = 0; i < TUBE_CAPACITY; i++) {
      allBalls.push(avatar);
    }
  });
  
  // Mezclar bolitas aleatoriamente
  allBalls.sort(() => Math.random() - 0.5);
  
  for(let i = 0; i < totalTubes; i++){
    tubes.push([]);
    let tubeEl = document.createElement('div');
    tubeEl.className = 'tube';
    tubeEl.onclick = () => selectTube(i, tubeEl);
    container.appendChild(tubeEl);
  }
  
  let ballIndex = 0;
  for(let i = 0; i < totalTubes - 2; i++){
    for(let j = 0; j < TUBE_CAPACITY; j++){
      if(ballIndex < allBalls.length){
        tubes[i].push(allBalls[ballIndex]);
        ballIndex++;
      }
    }
  }

  renderTubes();
}

function selectTube(i, tubeEl){
  const tubeElements = document.querySelectorAll('.tube');
  
  if(selected === null){
    if(tubes[i].length > 0){
      selected = i;
      tubeElements[i].classList.add('selected');
    }
  } else {
    // Verificar si el movimiento es válido (tubo destino no lleno)
    if(selected !== i && tubes[i].length < TUBE_CAPACITY){
      let ball = tubes[selected].pop();
      tubes[i].push(ball);
      
      renderTubes();
      
      // Comprobar si se completó el nivel tras el movimiento
      setTimeout(checkWin, 100);
    }
    
    tubeElements.forEach(t => t.classList.remove('selected'));
    selected = null;
  }
}

function renderTubes(){
  const tubeDivs = document.querySelectorAll('.tube');
  
  tubeDivs.forEach((tubeEl, i) => {
    tubeEl.innerHTML = '';
    tubes[i].forEach(ballData => {
      let ball = document.createElement('div');
      ball.className = 'ball';
      ball.innerText = ballData.emoji;
      // Asignar el color individual de fondo
      ball.style.backgroundColor = ballData.color; 
      tubeEl.appendChild(ball);
    });
  });
}

function checkWin(){
  let completedTubes = 0;
  const avatarsInPlay = getAvatarsForLevel(level).length;

  for(let tube of tubes){
    // Un tubo está completado si está vacío O si está lleno con 4 elementos iguales
    if(tube.length === 0){
      continue;
    }
    if(tube.length === TUBE_CAPACITY){
      const firstEmoji = tube[0].emoji;
      const allSame = tube.every(ball => ball.emoji === firstEmoji);
      if(allSame) {
        completedTubes++;
      }
    }
  }

  // Si se ordenaron la totalidad de avatares activos
  if(completedTubes === avatarsInPlay){
    alert(`🎉 ¡Felicidades! Has completado el Nivel ${level}`);
    level++;
    createTubes();
  }
}

function restartGame(){ 
  createTubes(); 
}
</script>
</body>
</html>
