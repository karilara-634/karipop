<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Karipop</title>
<style>
body { margin:0; font-family: 'Poppins', sans-serif; background: linear-gradient(to bottom, #0a0a2a, #1a1a4a); color:white; text-align:center; }
#startScreen, #gameScreen { width:100vw; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
#gameScreen { display:none; }
h1 { font-size: 3em; color: #FFD700; text-shadow: 0 0 10px #FFD700; }
.avatar-list { display:flex; gap:15px; margin:20px 0; flex-wrap:wrap; justify-content:center; }
.avatar { background: rgba(255,255,255,0.1); padding:10px 15px; border-radius:15px; font-size:1.2em; }
.tubes { display:flex; gap:15px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
.tube { width:70px; height:280px; border:3px solid #FFD700; border-radius:35px; display:flex; flex-direction:column-reverse; padding:5px; cursor:pointer; background: rgba(0,0,0,0.3); }
.ball { width:60px; height:60px; border-radius:50%; margin:3px auto; display:flex; align-items:center; justify-content:center; font-size:2.5em; background:white; }
.btn { background:#FFD700; color:#000; border:none; padding:12px 25px; border-radius:20px; font-size:1.1em; cursor:pointer; margin:10px; }
.selected { border: 4px solid red; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Karipop</h1>
  <p> Kari pop version Chiquibeitas</p>
  <h2>🌟 Los Avatares Principales 🌟</h2>
  <div class="avatar-list">
    <div class="avatar">🐰 : Kari</div>
    <div class="avatar">🧀 : Beita</div>
    <div class="avatar">🌸 : Daya</div>
    <div class="avatar">🍒 : Cristi</div>
  </div>
  <button class="btn" onclick="startGame()">¡Jugar Ahora!</button>
</div>

<div id="gameScreen">
  <h1>Karipop</h1>
  <p>Nivel 1 - Ordena a cada avatar en su tubo</p>
  <div class="tubes" id="tubes"></div>
  <button class="btn" onclick="restartGame()">Reiniciar</button>
</div>

<script>
// AQUÍ ESTÁN LOS 7 AVATARES
const avatars = [
  {emoji:'🐰', name:'Kari'},
  {emoji:'🧀', name:'Beita'},
  {emoji:'🌸', name:'Daya'},
  {emoji:'🍒', name:'Cristi'},
  {emoji:'🦫', name:'Adriana'}, // CASTOR
  {emoji:'🦭', name:'Mirella'}, // FOCA
  {emoji:'🦊', name:'Alexis'} // ZORRO
];

let tubes = [];
let selected = null;

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  createTubes();
}

function createTubes(){
  tubes = [];
  const tubeDiv = document.getElementById('tubes');
  tubeDiv.innerHTML='';

  // 4 bolitas de CADA avatar = 28 bolitas y las mezclamos
  let allBalls = [];
  avatars.forEach((av, index) => {
    for(let j=0; j<4; j++){
      allBalls.push(index);
    }
  });
  allBalls = allBalls.sort(() => Math.random() - 0.5);

  // 7 tubos
  for(let i=0; i<7; i++){
    let tube = document.createElement('div');
    tube.className = 'tube';
    tube.onclick = () => selectTube(i, tube);
    tubes.push([]);

    if(i<4){
      for(let j=0; j<7; j++){
        let avIndex = allBalls.pop();
        let ball = document.createElement('div');
        ball.className = 'ball';
        ball.innerHTML = avatars[avIndex].emoji; // AQUÍ PONE EL EMOJI
        tube.appendChild(ball);
        tubes[i].push(avIndex);
      }
    }
    tubeDiv.appendChild(tube);
  }
}

function selectTube(i, tubeEl){
  document.querySelectorAll('.tube').forEach(t => t.classList.remove('selected'));
  if(selected === null){
    if(tubes[i].length > 0){
      selected = i;
      tubeEl.classList.add('selected');
    }
  } else {
    if(selected!== i && tubes[i].length < 7){
      let ball = tubes[selected].pop();
      tubes[i].push(ball);
      updateTubes();
    }
    selected = null;
  }
}

function updateTubes(){
  const tubeDivs = document.querySelectorAll('.tube');
  tubeDivs.forEach((tubeEl, i) => {
    tubeEl.innerHTML = '';
    tubes[i].forEach(avIndex => {
      let ball = document.createElement('div');
      ball.className = 'ball';
      ball.innerHTML = avatars[avIndex].emoji;
      tubeEl.appendChild(ball);
    });
  });
}

function restartGame(){ createTubes(); }
</script>
</body>
</html>
