<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karipop</title>
<style>
  body { 
    margin: 0; 
    font-family: 'Poppins', sans-serif; 
    background: linear-gradient(to bottom, #0a0a2a, #1a1a4a); 
    color: white; 
    text-align: center; 
  }
  #startScreen, #gameScreen { 
    width: 100vw; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
  }
  #gameScreen { display: none; }
  h1 { font-size: 3em; color: #FFD700; text-shadow: 0 0 10px #FFD700; margin: 10px 0; }
  .avatar-list { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
  .avatar { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 15px; font-size: 1.2em; }
  .tubes { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .tube { 
    width: 70px; 
    height: 280px; 
    border: 3px solid #FFD700; 
    border-radius: 35px; 
    display: flex; 
    flex-direction: column-reverse; 
    padding: 5px; 
    cursor: pointer; 
    background: rgba(0,0,0,0.3); 
    box-sizing: border-box;
  }
  .ball { 
    width: 55px; 
    height: 55px; 
    border-radius: 50%; 
    margin: 3px auto; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 2em; 
    background: white; 
  }
  .btn { 
    background: #FFD700; 
    color: #000; 
    border: none; 
    padding: 12px 25px; 
    border-radius: 20px; 
    font-size: 1.1em; 
    cursor: pointer; 
    margin: 10px; 
    font-weight: bold;
  }
  .selected { border: 4px solid #FF4500; box-shadow: 0 0 15px #FF4500; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Karipop</h1>
  <p>Kari pop versión Chiquibeitas</p>
  <h2>🌟 Los Avatares Principales 🌟</h2>
  <div class="avatar-list">
    <div class="avatar">🐰 : Kari</div>
    <div class="avatar">🧀 : Beita</div>
    <div class="avatar">🌸 : Daya</div>
    <div class="avatar">🍒 : Cristi</div>
  </div>
  <button class="btn" onclick="startGame()">¡Jugar Ahora!</button>
</div>

<div id="gameScreen">
  <h1>Karipop</h1>
  <p id="levelText">Nivel 1 - Ordena a cada avatar en su tubo</p>
  <div class="tubes" id="tubes"></div>
  <button class="btn" onclick="restartGame()">Reiniciar</button>
</div>

<script>
const allAvatars = [
  {emoji:'🐰', name:'Kari'},
  {emoji:'🧀', name:'Beita'},
  {emoji:'🌸', name:'Daya'},
  {emoji:'🍒', name:'Cristi'},
  {emoji:'🦫', name:'Adriana'},
  {emoji:'🦭', name:'Mirella'},
  {emoji:'🦊', name:'Alexis'}
];

let level = 1;
let tubes = [];
let selected = null;
const TUBE_CAPACITY = 4; // Límite de bolitas por tubo

function getAvatarsForLevel(lvl){
  if(lvl <= 2) return allAvatars.slice(0,4);
  if(lvl == 3) return allAvatars.slice(0,5);
  if(lvl == 4) return allAvatars.slice(0,6);
  return allAvatars;
}

function getTubesForLevel(lvl){
  if(lvl <= 2) return 6;
  if(lvl == 3) return 7;
  if(lvl == 4) return 8;  
  return 9;
}

function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  createTubes();
}

function createTubes(){
  const container = document.getElementById('tubes');
  container.innerHTML = '';
  tubes = [];
  selected = null;
  
  const avatars = getAvatarsForLevel(level);
  const totalTubes = getTubesForLevel(level);
  
  // Generar bolitas (4 de cada tipo para que quepan en los tubos)
  let allBalls = [];
  avatars.forEach(avatar => {
    for(let i = 0; i < TUBE_CAPACITY; i++) {
      allBalls.push(avatar);
    }
  });
  
  // Mezclar bolitas
  allBalls.sort(() => Math.random() - 0.5);
  
  // Crear estructura de los tubos
  for(let i = 0; i < totalTubes; i++){
    tubes.push([]);
    let tubeEl = document.createElement('div');
    tubeEl.className = 'tube';
    tubeEl.onclick = () => selectTube(i, tubeEl);
    container.appendChild(tubeEl);
  }
  
  // Repartir bolitas en los tubos (dejando 2 vacíos al final)
  let ballIndex = 0;
  for(let i = 0; i < totalTubes - 2; i++){
    for(let j = 0; j < TUBE_CAPACITY; j++){
      if(ballIndex < allBalls.length){
        tubes[i].push(allBalls[ballIndex]);
        ballIndex++;
      }
    }
  }

  renderTubes();
}

function selectTube(i, tubeEl){
  const tubeElements = document.querySelectorAll('.tube');
  
  if(selected === null){
    // Seleccionar tubo de origen
    if(tubes[i].length > 0){
      selected = i;
      tubeElements[i].classList.add('selected');
    }
  } else {
    // Intentar mover al tubo de destino
    if(selected !== i && tubes[i].length < TUBE_CAPACITY){
      let ball = tubes[selected].pop();
      tubes[i].push(ball);
    }
    
    // Deseleccionar
    tubeElements.forEach(t => t.classList.remove('selected'));
    selected = null;
    renderTubes();
  }
}

function renderTubes(){
  const tubeDivs = document.querySelectorAll('.tube');
  
  tubeDivs.forEach((tubeEl, i) => {
    tubeEl.innerHTML = '';
    tubes[i].forEach(ballData => {
      let ball = document.createElement('div');
      ball.className = 'ball';
      ball.innerText = ballData.emoji;
      tubeEl.appendChild(ball);
    });
  });
}

function restartGame(){ 
  createTubes(); 
}
</script>
</body>
</html>
