<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karipop</title>
<style>
  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    font-family: 'Poppins', sans-serif; 
    color: white; 
    text-align: center; 
    overflow: hidden;
  }

  #bgContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 42, 0.65);
    z-index: -1;
  }

  #startScreen, #gameScreen { 
    width: 100vw; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    align-items: center;
    padding: 20px 0;
  }
  
  #gameScreen { display: none; }
  
  h1 { 
    font-size: 2.5em; 
    color: #FFD700; 
    text-shadow: 0 0 10px #FFD700, 0 0 20px rgba(0,0,0,0.8); 
    margin: 5px 0; 
  }

  .avatar-list { 
    display: flex; 
    gap: 12px; 
    margin: 10px 0; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 85%;
  }

  .avatar { 
    background: rgba(0, 0, 0, 0.5); 
    padding: 8px 12px; 
    border-radius: 15px; 
    font-size: 1.1em; 
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(5px);
  }

  /* Cabecera del juego inspirada en el diseño del ejemplo */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 95vw;
    max-width: 600px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 15px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .icon-btn {
    background: #3a506b;
    border: 2px solid #5bc0be;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2em;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s, background 0.2s;
  }

  .icon-btn:active {
    transform: scale(0.92);
  }

  .icon-btn:hover {
    background: #5bc0be;
    color: #000;
  }

  .level-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tubes { 
    display: flex; 
    gap: 10px; 
    margin: 5px 0; 
    flex-wrap: wrap; 
    justify-content: center; 
    max-width: 98vw;
    align-items: center;
  }

  /* Tubos alargados tipo probeta */
  .tube { 
    width: 52px; 
    height: 290px; 
    border: 3px solid rgba(255, 255, 255, 0.8); 
    border-top: none; 
    border-bottom-left-radius: 25px;
    border-bottom-right-radius: 25px;
    display: flex; 
    flex-direction: column-reverse; 
    padding: 4px; 
    cursor: pointer; 
    background: rgba(20, 20, 40, 0.35); 
    backdrop-filter: blur(4px);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.4);
    transition: transform 0.2s, border-color 0.2s;
  }

  .tube:hover {
    transform: translateY(-3px);
  }

  .ball { 
    width: 42px; 
    height: 42px; 
    border-radius: 50%; 
    margin: 3px auto; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.5em; 
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.35), 0 2px 5px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }

  .btn { 
    background: #FFD700;
